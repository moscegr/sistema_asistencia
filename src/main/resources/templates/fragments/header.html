<nav th:fragment="navbar(titulo, subtitulo)" class="navbar navbar-expand-lg py-3 px-4 shadow position-relative"
     style="background-color: #7b1b37 !important; color: white !important; z-index: 1060 !important; overflow: visible !important;">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
    * { box-sizing: border-box; }

    /* Forzar que nada corte el texto que sale del header */
    .navbar, .navbar > .container-fluid, .tigre-menu-container, .tigre-options {
        overflow: visible !important;
    }

    .nav-text-white p,
    .nav-text-white h5 { color: white !important; margin: 0; font-family: 'DM Sans', sans-serif; }

    #menu-toggle { color: white !important; cursor: pointer; transition: 0.3s; }
    #menu-toggle:hover { opacity: 0.75; transform: scale(1.1); }

    .tigre-menu-container {
        display: flex;
        align-items: center;
        gap: 0;
    }

    .tigre-options {
        display: flex;
        align-items: center;
        gap: 4px;
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 50px;
        padding: 5px 8px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }

    .tigre-divider {
        width: 1px;
        height: 22px;
        background: rgba(255,255,255,0.2);
        flex-shrink: 0;
    }

    .tigre-btn {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: none;
        background: transparent;
        color: rgba(255,255,255,0.85);
        cursor: pointer;
        transition: all 0.2s ease;
        z-index: 10;
        outline: none;
    }

    .tigre-btn i { font-size: 1rem; line-height: 1; pointer-events: none; }

    .tigre-btn.btn-profile:hover { background: #0088cc; color: #fff; transform: scale(1.12); }
    .tigre-btn.btn-logout:hover  { background: #e53e3e; color: #fff; transform: scale(1.12); }
    .tigre-btn.btn-home:hover    { background: #38a169; color: #fff; transform: scale(1.12); }
    .tigre-btn.btn-back:hover    { background: rgba(255,255,255,0.25); color: #fff; transform: scale(1.12); }

    /* ── ETIQUETA SIN BURBUJA (SOLO TEXTO) ── */
    .label-tigre {
        position: absolute;
        top: calc(100% + 8px); 
        left: 50%;
        transform: translateX(-50%) translateY(-5px);
        background: none; /* Sin fondo negro */
        color: #1a202c; /* Negro/Gris muy oscuro */
        font-size: 0.75rem;
        font-family: 'DM Sans', sans-serif;
        font-weight: 600;
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: all 0.2s ease;
        z-index: 999999 !important;
        /* Sombra blanca al texto para que resalte si toca algo oscuro */
        text-shadow: 1px 1px 0px #fff, -1px -1px 0px #fff, 1px -1px 0px #fff, -1px 1px 0px #fff;
    }

    /* Eliminamos la flechita negra */
    .label-tigre::after { display: none; }

    .label-tigre .lbl-action {
        display: block;
        font-size: 0.6rem;
        font-weight: 400;
        color: #4a5568;
        margin-top: -2px;
        text-align: center;
    }

    .tigre-btn:hover .label-tigre {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0);
    }

    .tigre-btn:hover { z-index: 100; }

    .tigre-img {
        width: 44px;
        height: 44px;
        object-fit: contain;
        filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
        margin-right: 12px;
        flex-shrink: 0;
    }
</style>

    <div class="d-flex align-items-center w-100" style="overflow: visible !important;">

        <i class="bi bi-list fs-3 me-3 nav-text-white" id="menu-toggle"></i>

        <div class="d-none d-md-block nav-text-white">
            <h5 class="fw-bold" th:text="${titulo}">Título</h5>
            <p class="small opacity-75" th:text="${subtitulo}">Subtítulo</p>
        </div>

        <div class="tigre-menu-container ms-auto" style="overflow: visible !important;">

            <img th:src="@{/img/tigres.png}"
                 alt="Tigre 134"
                 class="tigre-img">

            <div class="tigre-options">

                <button class="tigre-btn btn-profile" onclick="abrirModalMiPerfil()">
                    <i class="bi bi-person-gear"></i>
                    <span class="label-tigre">
                        Mi Perfil
                        <span class="lbl-action">Editar mis datos</span>
                    </span>
                </button>

                <div class="tigre-divider"></div>

                <button class="tigre-btn btn-back" onclick="window.history.back()">
                    <i class="bi bi-arrow-left"></i>
                    <span class="label-tigre">
                        Regresar
                        <span class="lbl-action">Página anterior</span>
                    </span>
                </button>

                <div class="tigre-divider"></div>

                <button class="tigre-btn btn-home" onclick="redirigirAlInicio()">
                    <i class="bi bi-house-door-fill"></i>
                    <span class="label-tigre">
                        Escritorio
                        <span class="lbl-action">Ir al inicio</span>
                    </span>
                </button>

                <div class="tigre-divider"></div>

                <button class="tigre-btn btn-logout" onclick="confirmarCerrarSesion()">
                    <i class="bi bi-box-arrow-right"></i>
                    <span class="label-tigre">
                        Cerrar sesión
                        <span class="lbl-action">Salir del sistema</span>
                    </span>
                </button>

            </div>
        </div>
    </div>
</nav>
