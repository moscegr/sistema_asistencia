<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Orientación - Monitoreo de Salud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" th:href="@{/css/nav_tigre.css}" />
    <link rel="icon" type="image/png" href="/img/favicon.png">
    
    <style>
        :root { --guinda: #7b1b37; }
        .text-guinda { color: var(--guinda); }
        #page-content-wrapper { width: 100%; min-width: 0; }
        
        /* Forzar que el modal esté por encima de la barra lateral y el header */
		.modal {
    	z-index: 2050 !important;
		}
		.modal-backdrop {
		    z-index: 2040 !important;
		}
		
		/* Si el modal se ve "atrapado" o recortado, asegúrate que el body no tenga overflow oculto */
		body.modal-open {
		    overflow: hidden !important;
		    padding-right: 0 !important;
		}
    </style>
</head>
<body class="bg-light">

    <div class="d-flex" id="wrapper">
        <div th:replace="~{fragments/nav_lateral :: sidebar}"></div>

        <div id="page-content-wrapper">
            <div th:replace="~{fragments/header :: navbar('Monitoreo de Salud', 'Expediente clínico y vulnerabilidad')}"></div>

            <div class="container-fluid px-4 py-4">

                <div class="card border-0 shadow-sm mb-4" style="border-radius: 15px; border-top: 4px solid var(--guinda) !important;">
                    <div class="card-body p-4">
                        <div class="row align-items-center">
                            <div class="col-md-7">
                                <h5 class="fw-bold mb-1 text-guinda">Expedientes Clínicos</h5>
                                <p class="small text-muted mb-0">Busca alumnos para consultar su estado, registrar diagnósticos y evaluar su nivel de riesgo (Semáforo).</p>
                            </div>
                            <div class="col-md-5 mt-3 mt-md-0">
                                <div class="input-group shadow-sm">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                                    <input type="text" id="busquedaSalud" class="form-control border-start-0" placeholder="Buscar por nombre, matrícula o especialidad...">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4" id="gridSalud">
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="modalPadecimiento" tabindex="-1">
	    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" style="max-width: 500px;">
	        <div class="modal-content border-0 shadow-lg" style="border-radius: 15px;">
	            <div class="modal-header text-white" style="background-color: var(--guinda); border-radius: 15px 15px 0 0;">
	                <h6 class="modal-title fw-bold"><i class="bi bi-file-medical me-2"></i>Gestión de Salud</h6>
	                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
	            </div>
	            
	            <div class="modal-body p-4">
	                <input type="hidden" id="saludMatricula">
	                
	                <div class="mb-3 border-bottom pb-2">
	                    <p class="text-muted x-small fw-bold text-uppercase mb-1" style="font-size: 0.65rem;">Estudiante Seleccionado</p>
	                    <div id="saludNombreAlumno" class="fw-bold text-dark" style="font-size: 1.1rem; line-height: 1.1;"></div>
	                </div>
	                
	                <div id="infoPreviaPadecimientos" class="mb-3" style="max-height: 180px; overflow-y: auto; padding-right: 5px;"></div>
	
	                <div class="requiere-permiso" data-roles="ADMIN,ORIENTACION">
	                    <button class="btn btn-sm w-100 mb-3 fw-bold shadow-sm" 
	                            type="button" data-bs-toggle="collapse" data-bs-target="#collapseNuevoRegistro" 
	                            style="background-color: #f8f9fa; border: 1px dashed var(--guinda); color: var(--guinda);">
	                        <i class="bi bi-plus-circle-fill me-2"></i>Registrar Padecimiento
	                    </button>
	
	                    <div class="collapse" id="collapseNuevoRegistro">
	                        <div class="p-3 bg-light rounded border mb-2">
	                            <h6 class="fw-bold mb-3" style="color: var(--guinda); font-size: 0.85rem;">Nuevo Registro</h6>
	                            
	                            <div class="mb-2">
	                                <label class="form-label small fw-bold">Padecimiento</label>
	                                <input type="text" id="saludTipo" class="form-control form-control-sm" placeholder="Ej. Asma">
	                            </div>
	                            
	                            <div class="mb-2">
	                                <label class="form-label small fw-bold">Nivel de Riesgo</label>
	                                <select id="saludGravedad" class="form-select form-select-sm">
	                                    <option value="Verde">Verde (Bajo)</option>
	                                    <option value="Amarillo">Amarillo (Medio)</option>
	                                    <option value="Rojo">Rojo (Alto)</option>
	                                </select>
	                            </div>
	
	                            <div class="mb-0">
	                                <label class="form-label small fw-bold">Indicaciones</label>
	                                <textarea id="saludDetalles" class="form-control form-control-sm" rows="2"></textarea>
	                            </div>
	                        </div>
	                    </div>
	                </div>
	            </div>
	
	            <div class="modal-footer bg-white border-0 shadow-sm" style="border-radius: 0 0 15px 15px;">
	                <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">Cerrar</button>
	                <button type="button" id="btnGuardarSalud" class="btn btn-sm text-white requiere-permiso" 
	                        data-roles="ADMIN,ORIENTACION" style="background-color: var(--guinda); display: none;" 
	                        onclick="guardarPadecimiento()">
	                        Guardar Registro
	                </button>
	            </div>
	        </div>
	    </div>
	</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script th:src="@{/js/firebase-init.js}"></script>
    <script th:src="@{/js/nav_tigre.js}"></script>
    <script th:src="@{/js/monitoreo_salud.js}"></script>
</body>
</html>
