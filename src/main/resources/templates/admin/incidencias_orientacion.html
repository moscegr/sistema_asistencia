<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Incidencias - Orientación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/nav_tigre.css}">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <style>
        :root { --guinda: #7b1b37; }
        .text-guinda { color: var(--guinda); }
        .fuente-reporte { font-family: 'Courier New', Courier, monospace; color: #000; font-weight: bold; text-transform: uppercase; }
        
        #contenedorReporteReal {
            width: 216mm; height: 279mm;
            background: url('/img/formato_reporte_incidencia.png') no-repeat center;
            background-size: contain; position: relative; margin: auto; background-color: white;
        }
        .campo-inc { position: absolute; font-size: 11pt; white-space: nowrap; }
        .marca-x { position: absolute; font-size: 14pt; font-family: Arial, sans-serif; font-weight: bold; }
        #page-content-wrapper { width: 100%; min-width: 0; }
    </style>
</head>
<body class="bg-light">

    <div class="d-flex" id="wrapper">
        <div th:replace="~{fragments/nav_lateral :: sidebar}"></div>

        <div id="page-content-wrapper">
            <div th:replace="~{fragments/header :: navbar('Incidencias Disciplinarias', 'Control y seguimiento del reglamento escolar')}"></div>

            <div class="container-fluid px-4 py-4">
                <div class="row g-4">
                    <div class="col-lg-4 no-print">
                        <div class="card border-0 shadow-sm p-4 h-100" style="border-radius: 15px;">
                            <h6 class="fw-bold mb-3 text-guinda">Captura de Incidencia</h6>
                            <div class="mb-3 position-relative">
                                <label class="form-label small fw-bold">Buscar Alumno</label>
                                <input type="text" id="busquedaAlInc" class="form-control shadow-sm" placeholder="Nombre o Matrícula...">
                                <div id="sugerenciasInc" class="list-group position-absolute w-100 shadow-lg z-3 mt-1" style="display: none;"></div>
                            </div>
                            
                            <label class="form-label small fw-bold">Faltas cometidas:</label>
                            <div id="checklistIncidencias" class="overflow-auto pe-2 border rounded p-3 bg-white shadow-inner" style="max-height: 350px;">
                                </div>

                            <div class="mt-3">
                                <label class="small fw-bold text-guinda">Especifique (OTRO):</label>
                                <input type="text" id="inputOtro" class="form-control" placeholder="...">
                            </div>

                            <button class="btn btn-danger w-100 mt-4 rounded-pill shadow" onclick="guardarIncidencia()">
                                <i class="bi bi-file-earmark-pdf-fill me-2"></i>Generar Reporte
                            </button>
                        </div>
                    </div>

                    <div class="col-lg-8">
					    <div class="shadow-lg rounded-3 overflow-auto p-2 bg-secondary bg-opacity-10" style="max-height: 700px;">
					        <div id="contenedorReporteReal" class="fuente-reporte mx-auto" style="transform: scale(0.90); transform-origin: top center; margin-bottom: -50px;"> 
					            <div style="top: 14.3%; left: -7%; width: 80%;" class="campo-inc text-end">
								    <span class="ciudad-plantel" th:text="${configSistema != null and configSistema['ciudad_plantel'] != null and !configSistema['ciudad_plantel'].isEmpty() ? configSistema['ciudad_plantel'] : (configSistema != null and configSistema['direccion_plantel'] != null and !configSistema['direccion_plantel'].isEmpty() ? configSistema['direccion_plantel'] : 'Chilpancingo de los Bravo, Gro.')}">Chilpancingo de los Bravo, Gro.</span>; a <span id="pdfDia">__</span> de <span id="pdfMes">__________</span> del <span id="pdfAnio">____</span>.
								</div>
					            <div style="top: 16.6%; left: 13.5%; width: 80%;" class="campo-inc">
					                Nombre del alumno(a): <span id="pdfNombreAl" style="padding-left: 10px;">________________________________________</span>
					            </div>
					            <div style="top: 18.8%; left: 13.5%; width: 80%;" class="campo-inc">
					                Semestre: <span id="pdfSemestre">__</span> Grupo: <span id="pdfGrupo">__</span> Especialidad: <span id="pdfEsp">_______________________</span>
					            </div>
					            <div id="capaMarcasX"></div>
					            <span style="top: 66.4%; left: 44%; font-size: 9pt;" class="campo-inc" id="pdfTextoOtro"></span>
					        </div>
					    </div>
					</div>

                    <div class="col-12 mt-2">
					    <div class="card border-0 shadow-sm p-4" style="border-radius: 15px;">
					        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
					            <h5 class="fw-bold mb-2 mb-md-0 text-guinda">Historial de Incidencias</h5>
					            <div class="input-group shadow-sm" style="max-width: 350px;">
					                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
					                <input type="text" id="buscarIncidenciaGlobal" class="form-control border-start-0 form-control-sm" placeholder="Buscar folio, matrícula o nombre...">
					            </div>
					        </div>
					        
					        <div class="table-responsive">
					            <table class="table table-hover align-middle small text-center">
					                <thead class="table-light">
					                    <tr><th>Folio</th><th>Estudiante</th><th>Fecha</th><th>Faltas</th><th>Acciones</th></tr>
					                </thead>
					                <tbody id="tablaIncidenciasGlobal"></tbody>
					            </table>
					        </div>
					    </div>
					</div>
                </div>
            </div> </div> </div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script th:src="@{/js/app-init.js}"></script>
    <script th:src="@{/js/incidencias_orientacion.js}"></script>
    <script th:src="@{/js/nav_tigre.js}"></script>
</body>
</html>
