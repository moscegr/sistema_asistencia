<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Orientación - Seguimiento Conductual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" th:href="@{/css/nav_tigre.css}" />
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <style>
        :root { --guinda: #7b1b37; }
        .text-guinda { color: var(--guinda); }
        #page-content-wrapper { width: 100%; min-width: 0; }
        .table-responsive { border-radius: 15px; }
    </style>
</head>
<body class="bg-light">
    <div class="d-flex" id="wrapper">
        <div th:replace="~{fragments/nav_lateral :: sidebar}"></div>
        <div id="page-content-wrapper">
            <div th:replace="~{fragments/header :: navbar('Seguimiento Conductual', 'Monitoreo de incidencias y reportes disciplinarios')}"></div>

            <div class="container-fluid px-4 py-4">
                <div class="card border-0 shadow-sm mb-4" style="border-radius: 15px;">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-8">
                                <h5 class="fw-bold mb-1 text-guinda">Buscador de Alertas</h5>
                                <p class="small text-muted mb-0">Filtra por nombre o matrícula para ver el historial acumulado.</p>
                            </div>
                            <div class="col-md-4">
							    <div class="input-group shadow-sm">
							        <a href="/admin/incidencias/orientacion" 
							           class="btn btn-outline-secondary btn-sm requiere-permiso" 
							           data-roles="ADMIN,ORIENTACION">
							           Crear incidencia
							        </a>
							        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
							        <input type="text" id="buscarAlumnoConductual" class="form-control border-start-0" placeholder="Buscar estudiante...">
							    </div>
							</div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm" style="border-radius: 15px; border-top: 4px solid var(--guinda) !important;">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr class="small text-uppercase">
                                    <th class="ps-4">Estudiante</th>
                                    <th class="text-center">Especialidad / Grupo</th>
                                    <th class="text-center">Total Incidencias</th>
                                    <th class="text-center pe-4">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="listaConductual">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalDetalleIncidencias" tabindex="-1">
	    <div class="modal-dialog modal-dialog-centered modal-lg">
	        <div class="modal-content border-0 shadow-lg" style="border-radius: 15px;">
	            <div class="modal-header text-white" style="background-color: var(--guinda); border-radius: 15px 15px 0 0;">
	                <h5 class="modal-title fw-bold"><i class="bi bi-journal-text me-2"></i>Historial Disciplinario Completo</h5>
	                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
	            </div>
	            <div class="modal-body p-0">
	                <div class="p-4 bg-white border-bottom">
	                    <div class="row align-items-center">
	                        <div class="col-auto">
	                            <img id="mdlFotoPerfil" src="/img/logo_aniversario.jpg" onerror="this.src='/img/logo_aniversario.jpg'" class="img-thumbnail rounded-circle shadow-sm" style="width: 70px; height: 70px; object-fit: cover;">
	                        </div>
	                        <div class="col">
	                            <h4 id="mdlNombre" class="fw-bold mb-0 text-dark"></h4>
	                            <span id="mdlMatricula" class="badge bg-light text-dark border"></span>
	                            <span id="mdlInfoExtra" class="text-muted small ms-2"></span>
	                            <div id="mdlTutor" class="text-muted small mt-2 p-2 bg-light rounded border"></div>
	                            <div class="mt-2">
	                                <span class="badge bg-danger rounded-pill">Total: <span id="mdlTotal">0</span> Reportes</span>
	                            </div>
	                        </div>
	                    </div>
	                </div>
	                <div class="p-4" style="max-height: 220px; overflow-y: auto;">
	                    <div id="mdlListaIncidencias" class="list-group list-group-flush">
	                    </div>
	                </div>
	            </div>
	            <div class="modal-footer bg-light border-0" style="border-radius: 0 0 15px 15px;">
	                <button type="button" class="btn btn-secondary shadow-sm" data-bs-dismiss="modal">Cerrar</button>
	            </div>
	        </div>
	    </div>
	</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/nav_tigre.js}"></script>
    <script th:src="@{/js/seguimiento_conductual.js}"></script>
</body>
</html>
