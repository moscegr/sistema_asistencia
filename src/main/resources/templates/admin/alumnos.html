<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title th:text="'Gestión de Alumnos - ' + (${configSistema != null and configSistema['nombre_plantel'] != null ? configSistema['nombre_plantel'] : 'Control Escolar'})">Gestión de Alumnos - Control Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/nav_tigre.css}">
    <link rel="icon" type="image/png" href="/img/favicon.png">
</head>
<body class="bg-light">
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments/nav_lateral :: sidebar}"></div>
    
    <div id="page-content-wrapper">
    <div th:replace="~{fragments/header :: navbar('Control de Estudiantes', 'Listado general y registros')}"></div>

    <div class="container-fluid px-3 px-md-4 py-3 py-md-4">
        <div class="card border-0 shadow-sm mb-4" style="border-radius: 15px;">
            <div class="card-body p-3 p-md-4">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <a href="/admin/alumnos/nuevo" class="btn text-white" style="background-color: #7b1b37;">
                        <i class="bi bi-person-plus me-1"></i> Nuevo Registro
                    </a>
                </div>

                <div class="row g-2 align-items-end">
				    <div class="col-md-3">
				        <label class="form-label small fw-bold text-muted">Búsqueda rápida</label>
				        <div class="input-group">
				            <input type="text" id="busquedaGeneral" class="form-control" placeholder="Nombre o Matrícula...">
				            <button class="btn btn-primary" style="background-color: #7b1b37; border-color: #7b1b37" type="button" id="btnBuscar" onclick="filtrarAlumnos()">
				                <i class="bi bi-search"></i>
				            </button>
				        </div>
				    </div>
				
				    <div class="col-md-2">
				        <label class="form-label small fw-bold text-muted">Carrera</label>
				        <select id="filtroEspecialidad" class="form-select" onchange="filtrarAlumnos()">
				            <option value="">-- Todas las Especialidades --</option>
				        </select>
				    </div>
				    
				    <div class="col-md-2">
					    <label class="form-label small fw-bold text-muted">Estatus</label>
					    <select id="filtroEstatus" class="form-select" onchange="filtrarAlumnos()">
					        <option value="">Todos</option>
					        <option value="Activo">Solo Activos</option>
					        <option value="Baja">Solo Bajas</option>
					        <option value="Egresado">Solo Egresados</option>
					    </select>
					</div>
				
				    <div class="col-md-1">
				        <label class="form-label small fw-bold text-muted">Grado</label>
				        <select id="filtroGrado" class="form-select" onchange="filtrarAlumnos()">
				            <option value="">Todo</option>
				            <option th:each="i : ${#numbers.sequence(1, 6)}" th:value="${i}" th:text="${i}"></option>
				        </select>
				    </div>
				
				    <div class="col-md-1">
				        <label class="form-label small fw-bold text-muted">Gpo</label>
				        <input type="text" id="filtroGrupo" class="form-control text-uppercase" placeholder="Ej: A" maxlength="1" oninput="filtrarAlumnos()">
				    </div>
				
				    <div class="col-md-2">
				        <label class="form-label small fw-bold text-muted">Turno</label>
				        <select id="filtroTurno" class="form-select" onchange="filtrarAlumnos()">
				            <option value="">Todos los Turnos</option>
				            <option value="Matutino">Matutino</option>
				            <option value="Vespertino">Vespertino</option>
				            <option value="Mixto">Mixto</option>
				        </select>
				    </div>
				
				    <div class="col-md-1">
				        <button class="btn btn-outline-danger w-100" onclick="limpiarFiltros()">
				            <i class="bi bi-eraser-fill me-1"></i>Limpiar
				        </button>
				    </div>
				</div>
            </div>
        </div>

        <div class="card border-0 shadow-sm" style="border-radius: 15px;">
            <div class="table-responsive p-3">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Matrícula</th>
                            <th>Estudiante</th>
                            <th>Especialidad</th>
                            <th>Grado/Gpo</th>
                            <th>Semáforo</th>
                            <th>Estatus</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaAlumnosBody">
                        <tr><td colspan="7" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-guinda me-2"></div>Cargando alumnos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    </div>
</div>

    <!-- Modal QR Ficha de Identidad Digital (En la raíz de body para evitar problemas de z-index y overflow) -->
    <div class="modal fade" id="modalQR" tabindex="-1" aria-hidden="true">
	    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
	        <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
	            <div class="modal-header border-0 bg-light">
	                <h5 class="modal-title fw-bold" style="color: #7b1b37;">
	                    <i class="bi bi-qr-code-scan me-2"></i>Ficha de Identidad Digital
	                </h5>
	                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
	            </div>
	            <div class="modal-body text-center pb-4">
	                <div class="mb-3">
	                    <img id="modalFoto" src="/img/default_avatar.png" onerror="this.src='/img/default_avatar.png'" class="img-thumbnail rounded-circle shadow-sm" style="width: 75px; height: 75px; object-fit: cover;">
	                </div>
	                <h5 id="modalNombre" class="fw-bold mb-1 text-dark"></h5>
	                <p id="modalEspecialidad" class="text-muted small mb-2"></p>
	                <div class="d-flex justify-content-center gap-3 mb-3 small">
	                    <div><strong>Matrícula:</strong> <span id="modalMatricula" class="text-guinda fw-bold"></span></div>
	                    <div><strong>Grupo:</strong> <span id="modalGradoGrupo"></span></div>
	                </div>

	                <div class="bg-white p-3 d-inline-block shadow-sm mb-3" style="border-radius: 15px; border: 1px solid #eee;">
					    <div id="imgQR" class="d-inline-block" style="width: 170px; height: 170px;"></div>
					</div>
	                
	                <div class="d-flex justify-content-center gap-2 mt-2">
	                    <button onclick="window.location.href='/admin/alumnos/expediente'" class="btn btn-sm bg-guinda text-white rounded-pill px-4">
	                        <i class="bi bi-folder-symlink me-1"></i>Ver Expediente Completo
	                    </button>
	                </div>
	            </div>
	        </div>
	    </div>
	</div>
	
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/app-init.js}"></script>
    <script th:src="@{/js/alumnos_list.js}"></script>
    <script th:src="@{/js/nav_tigre.js}"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
</html>
