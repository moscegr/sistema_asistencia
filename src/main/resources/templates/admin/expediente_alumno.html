<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title th:text="'Expediente Digital - ' + (${configSistema != null and configSistema[''nombre_plantel''] != null ? configSistema[''nombre_plantel''] : 'Control Escolar'})">Expediente Digital - Control Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/nav_tigre.css}">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <style>
        :root { --guinda: #7b1b37; }
        .bg-guinda { background-color: var(--guinda) !important; color: white !important; }
        .text-guinda { color: var(--guinda); }
        .btn-guinda { background-color: var(--guinda); color: white; border-radius: 50px; border: 1px solid white; transition: 0.3s; }
        .btn-guinda:hover { background-color: #5a1428; transform: scale(1.05); color: white; }
        .card-custom { border: none; border-radius: 15px; }
        
        .nav-pills .nav-link.active {
            background-color: var(--guinda) !important;
            color: white !important;
        }
        .nav-pills .nav-link { color: var(--guinda); font-weight: bold; }
        .bg-guinda .form-label { color: rgba(255,255,255,0.9); }
        
        #page-content-wrapper { width: 100%; min-width: 0; }
    </style>
</head>
<body class="bg-light">

    <div class="d-flex" id="wrapper">
        <div th:replace="~{fragments/nav_lateral :: sidebar}"></div>

        <div id="page-content-wrapper">
            <div th:replace="~{fragments/header :: navbar('Expediente Digital', 'Búsqueda y consulta de historial académico')}"></div>

            <div class="container-fluid px-4 py-4">
                
                <div id="seccionBuscador">
                    <div class="card card-custom shadow-sm p-4 mb-4 bg-guinda">
                        <h4 class="fw-bold mb-3"><i class="bi bi-search me-2"></i>Buscador de Expedientes</h4>
                        <div class="row g-3 align-items-end">
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Búsqueda</label>
                                <input type="text" id="busquedaGeneral" class="form-control" placeholder="Nombre o Matrícula...">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-bold">Especialidad</label>
                                <select id="filtroEspecialidad" class="form-select">
                                    <option value="">Todas las Especialidades</option>
                                    <option value="CONSTRUCCIÓN">CONSTRUCCIÓN</option>
                                    <option value="LABORATORISTA CLÍNICO">LABORATORISTA CLÍNICO</option>
                                    <option value="CONTABILIDAD">CONTABILIDAD</option>
                                    <option value="PROGRAMACIÓN">PROGRAMACIÓN</option>
                                    <option value="E.COMMERCE">E.COMMERCE</option>
                                    <option value="INTELIGENCIA ARTIFICIAL">INTELIGENCIA ARTIFICIAL</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label small fw-bold">Grado</label>
                                <input type="text" id="filtroGrado" class="form-control" placeholder="Ej: 3">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label small fw-bold">Grupo</label>
                                <input type="text" id="filtroGrupo" class="form-control" placeholder="Ej: A">
                            </div>
                            <div class="col-md-1 d-grid">
                                <button class="btn btn-guinda" id="btnBuscar"><i class="bi bi-search"></i></button>
                            </div>
                        </div>
                    </div>

                    <div class="card card-custom shadow-sm overflow-hidden">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 text-center">
                                <thead class="table-light small">
                                    <tr>
                                        <th>Matrícula</th><th>Alumno</th><th>Especialidad</th><th>Gpo</th><th>Estatus</th><th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaAlumnosBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div> 

                <div id="vistaExpediente" class="d-none">
				    <button class="btn btn-sm btn-outline-secondary mb-3" onclick="regresarABuscador()">
				        <i class="bi bi-arrow-left me-1"></i>Volver al buscador
				    </button>
				
				    <div class="row g-4 align-items-stretch">
				        <!-- PANEL IZQUIERDO: Perfil, Tutor y Salud -->
				        <div class="col-lg-4">
				            <div class="card card-custom shadow-sm p-4 text-center bg-guinda text-white h-100">
				                <div class="mb-2">
				                    <img id="expFotoPerfil" src="/img/logo_aniversario.jpg" onerror="this.src='/img/logo_aniversario.jpg'" class="img-thumbnail rounded-circle shadow" style="width: 110px; height: 110px; object-fit: cover;">
				                </div>
				                <h5 id="expNombre" class="fw-bold mb-1 text-white">---</h5>
				                <p id="expMatricula" class="text-white-50 small mb-3">---</p>
				                <div class="badge bg-light text-dark border w-100 py-2 mb-4" id="expEsp">---</div>
				                
				                <div class="text-start small mb-4">
				                    <p class="mb-1 text-white-50 small"><i class="bi bi-person-vcard me-1"></i>CURP:</p>
				                    <p class="mb-3 fw-bold text-white border-bottom border-secondary pb-2" id="expCurp">---</p>
				                    
				                    <p class="mb-1 text-white-50 small"><i class="bi bi-person-badge-fill me-1"></i>Tutor:</p>
				                    <p class="mb-1 fw-bold text-white" id="expTutor">---</p>
				                    <p class="mb-3 fw-bold text-white border-bottom border-secondary pb-2"><i class="bi bi-telephone-fill me-1 text-white-50"></i><span id="expTelTutor">---</span></p>
				                    
				                    <div class="d-flex align-items-center mb-3">
				                        <p class="mb-0 fw-bold text-white-50 me-2">Semáforo:</p>
				                        <span id="expSemaforo" class="badge bg-white text-dark shadow-sm">---</span>
				                    </div>
				
				                    <!-- CONTENEDOR PARA PADECIMIENTOS (JS lo llenará) -->
				                    <div id="expPadecimientos" class="w-100 mt-2"></div>
				                </div>
				
				                <!-- QR estirado hacia el fondo usando mt-auto -->
				                <div class="bg-white p-2 d-inline-block mx-auto mt-auto shadow-sm" style="border-radius: 10px;">
				                    <img id="expQR" src="" alt="QR Alumno" style="width: 140px; height: 140px;">
				                    <p id="expMatriculaQR" class="text-dark fw-bold small mt-2 mb-0"></p>
				                </div>
				            </div>
				        </div>
				
				        <!-- PANEL DERECHO: Estadísticas y Pestañas -->
				        <div class="col-lg-8 d-flex flex-column">
				            <div class="row g-3 mb-4">
				                <div class="col-md-4">
				                    <div class="card border-0 shadow-sm p-3 border-start border-primary border-5 h-100">
				                        <h3 id="cntPases" class="fw-bold mb-0 text-primary">0</h3>
				                        <small class="text-muted fw-bold">Pases de Salida</small>
				                    </div>
				                </div>
				                <div class="col-md-4">
				                    <div class="card border-0 shadow-sm p-3 border-start border-warning border-5 h-100">
				                        <h3 id="cntJustificantes" class="fw-bold mb-0 text-warning">0</h3>
				                        <small class="text-muted fw-bold">Justificantes</small>
				                    </div>
				                </div>
				                <div class="col-md-4">
				                    <div class="card border-0 shadow-sm p-3 border-start border-danger border-5 h-100">
				                        <h3 id="cntIncidencias" class="fw-bold mb-0 text-danger">0</h3>
				                        <small class="text-muted fw-bold">Incidencias</small>
				                    </div>
				                </div>
				            </div>
				
				            <!-- TARJETA DE PESTAÑAS (Estirada con flex-grow-1) -->
				            <div class="card card-custom shadow-sm p-4 flex-grow-1">
				                <ul class="nav nav-pills mb-3 border-bottom pb-2" id="pills-tab" role="tablist">
				                    <li class="nav-item">
				                        <button class="nav-link active rounded-pill px-4" data-bs-toggle="pill" data-bs-target="#tab-pases">
				                            <i class="bi bi-box-arrow-right me-1"></i> Pases
				                        </button>
				                    </li>
				                    <li class="nav-item">
				                        <button class="nav-link rounded-pill px-4" data-bs-toggle="pill" data-bs-target="#tab-justificantes">
				                            <i class="bi bi-file-medical me-1"></i> Justificantes
				                        </button>
				                    </li>
				                    <li class="nav-item">
				                        <button class="nav-link rounded-pill px-4" data-bs-toggle="pill" data-bs-target="#tab-incidencias">
				                            <i class="bi bi-exclamation-triangle me-1"></i> Incidencias
				                        </button>
				                    </li>
				                </ul>
				                
				                <!-- Contenedor con Scroll para historial largo -->
				                <div class="tab-content flex-grow-1 pe-2" id="pills-tabContent" style="max-height: 450px; overflow-y: auto;">
				                    <div class="tab-pane fade show active" id="tab-pases">
				                        <ul class="list-group list-group-flush" id="listaHistorialPases"></ul>
				                    </div>
				                    <div class="tab-pane fade" id="tab-justificantes">
				                        <ul class="list-group list-group-flush" id="listaHistorialJust"></ul>
				                    </div>
				                    <div class="tab-pane fade" id="tab-incidencias">
				                        <ul class="list-group list-group-flush" id="listaHistorialInc"></ul>
				                    </div>
				                </div>
				            </div>
				        </div>
				    </div>
				</div> </div> </div> </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/js/expediente_alumno.js"></script>
    <script th:src="@{/js/app-init.js}"></script>
    <script th:src="@{/js/nav_tigre.js}"></script>
</body>
</html>
