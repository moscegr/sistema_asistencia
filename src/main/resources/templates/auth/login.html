<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="(${configSistema != null and configSistema['nombre_plantel'] != null ? configSistema['nombre_plantel'] : 'Control Escolar'}) + ' - Iniciar Sesión'">Iniciar Sesión</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" href="/img/favicon.png">

    <style>
        body {
            background: linear-gradient(135deg, #ffffff 0%, #3d0d1b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden; 
            margin: 0;
        }

        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.5);
            overflow: hidden;
            width: 900px;
            max-width: 95%;
            position: relative; 
            z-index: 1;
        }

        .left-panel {
            background: linear-gradient(135deg, rgba(123, 27, 55, 0.95) 0%, rgba(61, 13, 27, 0.95) 100%);
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
        }

        .right-panel {
            padding: 4rem 3rem;
            background: transparent;
        }

        .system-title {
            font-size: 0.9rem;
            line-height: 1.5;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-control.glass-input {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #333333;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .form-control.glass-input:focus {
            background: #ffffff;
            border-color: #7b1b37;
            box-shadow: 0 0 0 0.25rem rgba(123, 27, 55, 0.25);
            color: #000000;
        }

        .input-group-text.glass-addon {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-right: none;
            color: #7b1b37;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
        }

        .btn.glass-addon-end {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-left: none;
            color: #6c757d;
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 0.85rem;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .btn.glass-addon-end:hover {
            color: #7b1b37;
            background: #f8f9fa;
        }

        .btn-institucional {
            background: #7b1b37;
            color: #ffffff;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(123, 27, 55, 0.3);
        }

        .btn-institucional:hover {
            background: #922243;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123, 27, 55, 0.4);
        }

        .text-glass-link {
            color: #7b1b37;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .text-glass-link:hover {
            color: #922243;
            text-decoration: underline;
        }

        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #7b1b37 0%, #20050c 100%);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .loader-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: floatUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .loader-logo {
            width: 140px;
            height: 140px;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
            animation: pulseSoft 2s infinite ease-in-out;
        }

        @keyframes floatUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes pulseSoft {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>
<body>
<div id="loader-overlay" class="loader-overlay d-none">
    <div class="loader-content text-center">
        <img id="loaderLogo" 
             th:src="${configSistema != null and configSistema['logo_inicio_url'] != null ? configSistema['logo_inicio_url'] : '/img/tigres.png'}" 
             alt="Cargando..." 
             class="loader-logo mb-4"
             onerror="this.src='/img/tigres.png'">
        <h2 id="lbl-saludo-usuario" class="text-white fw-light mb-1" style="display: none; font-size: 1.5rem;"></h2>
        <h3 class="text-white fw-bold" style="letter-spacing: 1px;">
            Preparando <span id="lbl-rol-destino" class="fw-bold text-white"></span>
        </h3>
        <p id="loader-texto-secundario" class="text-white-50" style="font-size: 0.9rem;">Verificando credenciales...</p>
    </div>
</div>

    <canvas id="particles-canvas"></canvas>

    <div class="glass-container row mx-0">
        <div class="col-md-5 d-none d-md-flex left-panel">
            <img id="loginLogoPlantel" 
                 th:src="${configSistema != null and configSistema['logo_plantel_url'] != null ? configSistema['logo_plantel_url'] : '/img/logo_aniversario.jpg'}" 
                 alt="Logo Plantel" 
                 class="img-fluid mb-4" 
                 style="max-height: 160px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); border-radius: 10px; object-fit: contain;"
                 onerror="this.src='/img/logo_aniversario.jpg'">
            <h4 id="loginNombrePlantel" class="fw-bold mb-3" th:text="${configSistema != null and configSistema['nombre_plantel'] != null ? configSistema['nombre_plantel'] : 'Control Escolar'}">Control Escolar</h4>
            <p id="loginSloganPlantel" class="mb-0 text-white-50 system-title" th:text="${configSistema != null and configSistema['slogan_plantel'] != null ? configSistema['slogan_plantel'] : ''}">
            </p>
        </div>

        <div class="col-md-7 right-panel d-flex flex-column justify-content-center">
            <div class="text-center mb-5">
                <img id="loginLogoInicio" 
                     th:src="${configSistema != null and configSistema['logo_inicio_url'] != null ? configSistema['logo_inicio_url'] : '/img/tigres.png'}" 
                     alt="Logo / Mascota" 
                     class="img-fluid mb-3" 
                     style="max-height: 100px; object-fit: contain;"
                     onerror="this.src='/img/tigres.png'">
                <h4 class="fw-bold text-uppercase" style="color: #7b1b37;">Iniciar Sesión</h4>
                <p id="loginDescripcionPlantel" class="mb-1 small text-muted fw-semibold"
                   th:text="'SISTEMA DE CONTROL DE ACCESO INTELIGENTE Y GESTIÓN COMPLEMENTARIA DEL ALUMNADO EN ' + (${configSistema != null and configSistema['nombre_oficial_plantel'] != null and !configSistema['nombre_oficial_plantel'].isEmpty() ? configSistema['nombre_oficial_plantel'] : (configSistema != null and configSistema['nombre_plantel'] != null ? configSistema['nombre_plantel'] : 'EL PLANTEL')})">
                   SISTEMA DE CONTROL DE ACCESO INTELIGENTE Y GESTIÓN COMPLEMENTARIA DEL ALUMNADO
                </p>
            </div>

            <form id="loginForm" th:action="@{/login}" action="/login" method="POST">
                <div class="mb-4">
                    <div class="input-group">
                        <span class="input-group-text glass-addon"><i class="bi bi-person"></i></span>
                        <input type="email" id="email" name="username" class="form-control glass-input" placeholder="Correo Institucional" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <div class="input-group">
                        <span class="input-group-text glass-addon"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" name="password" class="form-control glass-input" placeholder="Contraseña" required autocomplete="current-password">
                        <button class="btn glass-addon-end" type="button" id="togglePassword" title="Mostrar u ocultar contraseña" aria-label="Mostrar u ocultar contraseña">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-institucional w-100 py-2 mb-3 fw-bold rounded-3">
                    Ingresar al Sistema
                </button>
                
                <div class="text-center mt-3">
				    <a href="#" onclick="recuperarPassword(event)" class="text-glass-link small">¿Olvidaste tu contraseña?</a>
				</div>
            </form>
        </div>
    </div>

	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script th:src="@{/js/auth.js}"></script>
</body>
</html>
