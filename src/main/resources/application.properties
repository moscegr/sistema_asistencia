spring.application.name=ResidenciaCBTIS134

# Soporte para Reverse Proxy HTTPS en Coolify (Traefik/Nginx SSL)
server.forward-headers-strategy=framework

# Duración de sesión en servidor (7 días para evitar cierres involuntarios en Punto de Control / Guardia)
server.servlet.session.timeout=7d
server.servlet.session.cookie.max-age=7d

# Configuración MongoDB para producción (Coolify) y local
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/cbtis134_db?authSource=admin}
