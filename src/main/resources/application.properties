spring.application.name=ResidenciaCBTIS134

# Soporte para Reverse Proxy HTTPS en Coolify (Traefik/Nginx SSL)
server.forward-headers-strategy=framework

# ─── Seguridad de sesión ────────────────────────────────────────────────────────
# Sesión de 8 horas (turno más largo) — no 7 días para minimizar exposición
server.servlet.session.timeout=8h
server.servlet.session.cookie.max-age=28800
# Cookie segura: solo HTTPS, no accesible desde JS
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Strict

# ─── Límite de tamaño de archivos (backup/restore y fotos) ─────────────────────
# Máximo 10 MB para evitar DoS con archivos gigantes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ─── MongoDB ────────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/cbtis134_db?authSource=admin}

# ─── Actuator: deshabilitar exposición pública de endpoints de monitoreo ────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ─── Landing Page Institucional (Por default desactivada para multi-escuela DGETI) ──
# Si no está definida o es false, '/' e '/index' redirigen directo a '/login'.
# Solo con 'true' se despliega la página de presentación del CBTis 134.
app.landing.enabled=${ENABLE_LANDING_PAGE:${HABILITAR_LANDING_PAGE:false}}
